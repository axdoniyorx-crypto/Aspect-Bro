name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Reponi yuklash
      uses: actions/checkout@v4

    - name: Java (JDK 17) o'rnatish
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Debug Keystore yaratish
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Mock google-services.json yaratish (agar kerak bo'lsa)
      run: |
        if [ ! -f "app/google-services.json" ]; then
          echo '{"project_info":{"project_number":"0","project_id":"test"},"client":[{"client_info":{"mobilesdk_app_id":"1:0:android:0","android_client_info":{"package_name":"com.example.aspectbro"}}}]}' > app/google-services.json
        fi

    - name: Gradle o'rnatish
      uses: gradle/actions/setup-gradle@v3

    - name: Gradle Wrapper yaratish
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: APK yig'ish (Assemble Debug)
      run: ./gradlew assembleDebug --stacktrace

    - name: APK faylni saqlash
      uses: actions/upload-artifact@v4
      with:
        name: aspect-bro-apk
        path: app/build/outputs/apk/**/*.apk
