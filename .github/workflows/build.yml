name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Reponi yuklash
      uses: actions/checkout@v4

    - name: Java (JDK 17) o'rnatish
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle o'rnatish
      uses: gradle/actions/setup-gradle@v3

    # Agar ildizda gradlew bo'lmasa, uni avtomatik yaratadi
    - name: Gradle Wrapper yaratish
      run: |
        if [ ! -f "gradlew" ]; then
          gradle wrapper
        fi
        chmod +x gradlew

    - name: APK yig'ish (Assemble Debug)
      run: ./gradlew assembleDebug

    - name: APK faylni saqlash
      uses: actions/upload-artifact@v4
      with:
        name: aspect-bro-apk
        path: app/build/outputs/apk/**/*.apk
